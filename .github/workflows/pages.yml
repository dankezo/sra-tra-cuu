name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify sourcing and existing lookup
        run: |
          python -m pip install 'requests>=2.31,<3'
          python -m unittest discover -s api-sourcing -p 'test_*.py'
          node --test api-sourcing/test_cloud_worker.mjs
          node --test api-sourcing/test_enrichment.mjs
          node api-sourcing/test_logic.cjs
          node api-sourcing/test_excel.cjs
          node test_vn_logic.js
          node test_vn_policy.js
          node test_compare_logic.js
      - name: Stage site
        run: |
          mkdir -p site
          cp index.html README.md .nojekyll site/
          mkdir -p site/partner-catalogs
          cp partner-catalogs/index.html site/partner-catalogs/
          mkdir -p site/api-sourcing
          cp api-sourcing/index.html api-sourcing/snapshot.json.gz api-sourcing/excel.js site/api-sourcing/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
